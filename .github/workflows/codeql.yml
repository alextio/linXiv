# CodeQL advanced setup.
#
# This replaces GitHub's default ("automatic") setup, which cannot be kept for
# some languages while others move to advanced setup — the two are mutually
# exclusive per repository, so all three languages live here.
#
# Why we left default setup: its checkout hardcodes `submodules: false`, and
# src-tauri/crates/p2p is both a git submodule and a `[workspace] members` entry.
# `cargo metadata` therefore failed instantly ("failed to load manifest for
# dependency `linxiv-p2p`"), the Rust extractor fell back to parsing each file in
# isolation, and all 110 files were extracted with no semantic information —
# 13% call-target resolution against a 50% threshold, macro expansion skipped.
# Since the Tauri command surface is macro-generated, that left the actual
# untrusted-input handlers invisible to the scan.
name: CodeQL

on:
  pull_request:
    branches: [main, dev]

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    env:
      # PRs to main always scan; PRs to dev skip the scan for trusted
      # authors. TRUSTED_AUTHORS is a repo Actions variable holding a JSON
      # array of GitHub usernames, e.g. ["jakeuribe"]. Unset/empty means
      # trust no one. The skip is per-step, not a job-level `if`: skipped
      # legs upload an empty SARIF under the same job id and category, so
      # code scanning still finds the configurations refs/heads/main has
      # and can compute the PR alert delta — a job-level skip made it warn
      # "1 configuration present on refs/heads/main was not found" on
      # every trusted dev PR push (seen on PR #285).
      SCAN: >-
        ${{ github.base_ref == 'main' ||
        !contains(fromJSON(vars.TRUSTED_AUTHORS || '[]'), github.event.pull_request.user.login) }}
    permissions:
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            submodules: "false"
          - language: javascript-typescript
            submodules: "false"
          - language: rust
            # Required: crates/p2p is a workspace member living in a submodule.
            submodules: "recursive"
    steps:
      # Unconditional: the waiver upload below also wants a checkout for
      # the codeql-action's git provenance probing.
      - uses: actions/checkout@v7
        with:
          submodules: ${{ matrix.submodules }}

      - uses: dtolnay/rust-toolchain@stable
        if: env.SCAN == 'true' && matrix.language == 'rust'

      - uses: Swatinem/rust-cache@v2
        if: env.SCAN == 'true' && matrix.language == 'rust'
        with:
          workspaces: src-tauri

      # Secondary to the submodule fix, but still load-bearing: the extractor
      # resolves the workspace with `cargo metadata`, which walks the full
      # dependency graph. Populating ~/.cargo up front keeps that resolution off
      # the network and well inside the extractor's patience.
      - name: cargo fetch
        if: env.SCAN == 'true' && matrix.language == 'rust'
        working-directory: src-tauri
        run: cargo fetch --locked

      - uses: github/codeql-action/init@v4
        if: env.SCAN == 'true'
        with:
          languages: ${{ matrix.language }}
          # No compilation: `build-mode: none` matches what default setup used,
          # which is why the Tauri system deps and pdfium that ci.yml installs
          # are not needed here.
          build-mode: none
          # `queries` is deliberately unset to keep default setup's "default"
          # query suite; the threat model likewise defaults to "remote".

      - uses: github/codeql-action/analyze@v4
        if: env.SCAN == 'true'
        with:
          category: "/language:${{ matrix.language }}"

      # Trusted-author dev PRs: register the configuration without scanning.
      # An empty result set is truthful here — the merge gate for this code
      # is the PR to main, which always runs the real scan.
      - name: Write waiver SARIF
        if: env.SCAN != 'true'
        run: >-
          printf '%s'
          '{"version":"2.1.0","runs":[{"tool":{"driver":{"name":"CodeQL"}},"results":[]}]}'
          > waiver.sarif

      - uses: github/codeql-action/upload-sarif@v4
        if: env.SCAN != 'true'
        with:
          sarif_file: waiver.sarif
          category: "/language:${{ matrix.language }}"
